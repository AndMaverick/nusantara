[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nusantara"
version = "0.1.0"
description = "Indonesian text and number utilities for AI pipelines: rupiah amounts, chat slang, dates, and +62 phone numbers. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["nusantara*"]
